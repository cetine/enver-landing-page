- id: vertragsklar
  url: https://vertragsklar.de
  status: live
  en:
    name: Vertragsklar
    tagline: 'AI contract analysis for consumers: five specialized legal AI agents review German contracts in under two minutes.'
    story: Built to make contract risks understandable for non-lawyers. An "AI council" of five specialized agents (contract law, T&C, tenancy, labor law, risk) cross-validates findings and produces a plain-language PDF report. GDPR-compliant, German servers, one-time pricing.
  de:
    name: Vertragsklar
    tagline: 'KI-Vertragsanalyse für Verbraucher: fünf spezialisierte Legal-KI-Agenten prüfen deutsche Verträge in unter zwei Minuten.'
    story: Gebaut, um Vertragsrisiken für Nicht-Juristen verständlich zu machen. Ein „KI-Rat" aus fünf spezialisierten Agenten (Vertragsrecht, AGB, Mietrecht, Arbeitsrecht, Risiko) validiert Befunde gegenseitig und erzeugt einen verständlichen PDF-Report. DSGVO-konform, deutsche Server, Einmalpreis.
- id: nebenkosten-ninja
  url: https://nebenkosten-ninja.de
  status: live
  en:
    name: Nebenkosten-Ninja
    tagline: 'Freemium checker for German utility-cost statements: a client-side rules engine spots the most common billing errors.'
    story: German tenants overpay through faulty utility statements every year. Nebenkosten-Ninja checks a statement against a curated rule set entirely in the browser, with no upload and no account, and explains every finding in plain language.
  de:
    name: Nebenkosten-Ninja
    tagline: 'Freemium-Check für Nebenkostenabrechnungen: eine client-seitige Regel-Engine findet die häufigsten Abrechnungsfehler.'
    story: Mieter zahlen jedes Jahr durch fehlerhafte Nebenkostenabrechnungen drauf. Nebenkosten-Ninja prüft eine Abrechnung vollständig im Browser gegen ein kuratiertes Regelwerk, ganz ohne Upload und ohne Konto, und erklärt jeden Befund verständlich.
- id: flokora
  url: https://flokora.cloud/en/
  status: preview
  en:
    name: Flokora
    tagline: 'Meeting companion for the Mac: transcribes calls on the device, shows a short answer in the notch when a customer asks, and turns rough notes into clean ones.'
    story: Built so you can answer customers without leaving the call. No bot joins. Flokora listens to the microphone and call audio on the Mac, transcribes with NVIDIA Parakeet in German and English, and writes answers and notes with the AI you choose, local models included. Every evening it links customers, people and topics across calls, each idea backed by the quotes it rests on. Early access for macOS.
  de:
    name: Flokora
    tagline: 'Meeting-Begleiter für den Mac: transkribiert Calls direkt auf dem Gerät, zeigt eine kurze Antwort in der Notch, wenn der Kunde fragt, und macht aus Stichworten saubere Notizen.'
    story: Gebaut, um Kunden antworten zu können, ohne den Call zu verlassen. Kein Bot tritt bei. Flokora hört Mikrofon und Call-Audio auf dem Mac, transkribiert mit NVIDIA Parakeet auf Deutsch und Englisch und schreibt Antworten und Notizen mit einer frei wählbaren KI, auch einem lokalen Modell. Jeden Abend verknüpft es Kunden, Personen und Themen über alle Calls hinweg, jede Idee belegt mit den Zitaten, auf denen sie beruht. Early Access für macOS.
